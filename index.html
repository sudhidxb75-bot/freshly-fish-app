<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freshly Fish Delivery</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f4f8f7;color:#222}
header{background:#00695c;color:white;text-align:center;padding:30px 15px}
header h1{font-size:40px}
header p{margin-top:8px}
.badge{background:#ffca28;color:#222;display:inline-block;margin-top:15px;padding:10px 18px;border-radius:25px;font-weight:bold}
.container{padding:20px;max-width:1100px;margin:auto}
.top-actions{display:flex;gap:10px;margin-bottom:20px}
button{border:none;border-radius:10px;padding:12px 15px;cursor:pointer;font-weight:bold}
.lang{background:#004d40;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.card{background:white;border-radius:18px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.1)}
.card img{width:100%;height:210px;object-fit:cover}
.content{padding:15px}
.price{font-size:22px;font-weight:bold;color:#009688;margin:10px 0}
.add{background:#009688;color:white;width:100%}
.add:disabled{background:#999}
.cart{position:fixed;right:15px;bottom:15px;background:#25D366;color:white;border-radius:50%;width:70px;height:70px;font-size:22px}
.cart-box{background:white;margin-top:25px;padding:20px;border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.1)}
input,textarea,select{width:100%;padding:13px;margin:8px 0;border:1px solid #ccc;border-radius:10px}
.order{background:#25D366;color:white;width:100%;font-size:18px;margin-top:10px}
footer{text-align:center;background:#004d40;color:white;padding:20px;margin-top:30px}
</style>
</head>

<body>

<header>
<h1>Freshly</h1>
<p>Premium Kerala Seafood Delivery</p>
<div class="badge">Delivery 4 PM - 7 PM</div>
</header>

<div class="container">

<div class="top-actions">
<button class="lang" onclick="toggleLang()">മലയാളം / English</button>
<button onclick="loadFish()">Refresh Items</button>
</div>

<h2 id="title">Today's Fresh Catch</h2>
<br>

<div id="fishContainer" class="grid">Loading...</div>

<div class="cart-box">
<h2 id="cartTitle">Your Cart</h2>
<div id="cartItems"></div>
<h3>Total ₹<span id="total">0</span></h3>

<input id="name" placeholder="Your Name">
<input id="phone" placeholder="Phone Number">
<textarea id="address" placeholder="Delivery Address"></textarea>

<select id="payment">
<option value="Cash on Delivery">Cash on Delivery</option>
<option value="UPI - sudime-1@okaxis">UPI - sudime-1@okaxis</option>
</select>

<button class="order" onclick="placeOrder()">Order on WhatsApp</button>
</div>

</div>

<button class="cart" onclick="document.querySelector('.cart-box').scrollIntoView()">
🛒 <span id="count">0</span>
</button>

<footer>
Freshly © 2026 | Fresh Fish Kerala
</footer>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRaa73eTvuPFc-VUT5-bbXe0oSWC6UjzRryJCbrrB3fjy2l8JLI85gqljhnriQCcdvJXto-I4HbO8c4/pub?output=csv";

const ORDER_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzP12x-LLYQPqPTRnRPxNNIxUwBjlnmHWPYrAxrVvwwD7lqhP6KsB-MWZY-4YiXrVSzug/exec";

const WHATSAPP_NUMBER = "918921696649";

let fishData = [];
let cart = [];
let ml = false;

function parseCSV(text){
  const lines = text.trim().split(/\r?\n/);
  return lines.slice(1).map(line => {
    const cols = line.split(",");
    return {
      name: cols[0]?.trim(),
      malayalam: cols[1]?.trim(),
      price: Number(cols[2]?.trim()),
      stock: cols[3]?.trim().toLowerCase() === "true",
      image: cols.slice(4).join(",").trim()
    };
  }).filter(x => x.name);
}

async function loadFish(){
  const box = document.getElementById("fishContainer");
  box.innerHTML = "Loading fish items...";

  try{
    const res = await fetch(CSV_URL);
    const csv = await res.text();
    fishData = parseCSV(csv);
    box.innerHTML = "";

    fishData.forEach((fish,i)=>{
      box.innerHTML += `
      <div class="card">
        <img src="${fish.image}" onerror="this.src='https://images.unsplash.com/photo-1544943910-4c1dc44aab44?w=800'">
        <div class="content">
          <h3>${ml ? fish.malayalam : fish.name}</h3>
          <p>${ml ? fish.name : fish.malayalam}</p>
          <div class="price">₹${fish.price}/Kg</div>
          <p style="color:${fish.stock ? 'green':'red'}">${fish.stock ? 'In Stock':'Out of Stock'}</p>
          <button class="add" onclick="addToCart(${i})" ${fish.stock ? '' : 'disabled'}>
            ${ml ? 'കാർട്ടിലേക്ക് ചേർക്കുക':'Add to Cart'}
          </button>
        </div>
      </div>`;
    });

  }catch(e){
    box.innerHTML = "Fish items failed to load. Check Google Sheet.";
  }
}

function addToCart(i){
  cart.push(fishData[i]);
  updateCart();
}

function updateCart(){
  const list = document.getElementById("cartItems");
  list.innerHTML = "";
  let total = 0;

  cart.forEach((item,i)=>{
    total += item.price;
    list.innerHTML += `
    <p>${item.name} - ₹${item.price}
    <button onclick="removeItem(${i})">Remove</button></p>`;
  });

  document.getElementById("total").innerText = total;
  document.getElementById("count").innerText = cart.length;
}

function removeItem(i){
  cart.splice(i,1);
  updateCart();
}

async function placeOrder(){
  if(cart.length === 0){
    alert("Cart is empty");
    return;
  }

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const address = document.getElementById("address").value.trim();
  const payment = document.getElementById("payment").value;
  const slot = "4 PM - 7 PM";

  if(!name || !phone || !address){
    alert("Please fill name, phone and address");
    return;
  }

  const items = cart.map(x => `${x.name} - ₹${x.price}/Kg`).join(" | ");
  const total = cart.reduce((s,x)=>s+x.price,0);

  const formData = new URLSearchParams();
  formData.append("name", name);
  formData.append("phone", phone);
  formData.append("address", address);
  formData.append("items", items);
  formData.append("total", total);
  formData.append("payment", payment);
  formData.append("slot", slot);

  fetch(ORDER_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    body: formData
  });

  const msg =
`🐟 Freshly Fish Order

Name: ${name}
Phone: ${phone}
Address: ${address}

Items:
${items}

Total: ₹${total}
Payment: ${payment}
Delivery: ${slot}

Please confirm my order.`;

  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`,"_blank");

  cart = [];
  updateCart();
}

function toggleLang(){
  ml = !ml;
  document.getElementById("title").innerText = ml ? "ഇന്നത്തെ മീൻ ലഭ്യത" : "Today's Fresh Catch";
  document.getElementById("cartTitle").innerText = ml ? "നിങ്ങളുടെ കാർട്ട്" : "Your Cart";
  loadFish();
}

loadFish();
</script>

</body>
</html>
