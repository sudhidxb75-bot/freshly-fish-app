<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freshly Fish Delivery</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="container">
<h2 id="title">Today's Fresh Catch</h2>
<div id="fishContainer" class="grid">Loading...</div>
<div class="cart-box">
<h2 id="cartTitle">Your Cart</h2>
<div id="cartItems"></div>
<span id="subtotal">0</span><span id="cleaningTotal">0</span><span id="marinationTotal">0</span><span id="deliveryCharge">0</span><span id="total">0</span><span id="count">0</span>
<input id="name" placeholder="Your Name"><input id="phone" placeholder="Phone Number"><input id="city" placeholder="City / Town"><input id="pincode" placeholder="Pin Code">
<div id="hubPreview"></div><select id="hubSelect"></select><select id="fulfillment"><option value="Home Delivery">Home Delivery</option><option value="Hub Pickup">Hub Pickup</option></select><select id="deliverySlot"></select>
<textarea id="address"></textarea><select id="payment"><option value="UPI Payment Now">UPI Payment Now</option><option value="Pay on Delivery / Pickup - UPI Only">Pay on Delivery / Pickup - UPI Only</option></select><div id="qrSection"></div>
<button onclick="placeOrder()">Order on WhatsApp</button>
</div>
</div>
<script src="assets/app.js?v=16"></script>
</body>
</html>
